name: keepalive

# Pings the live demo every 10 minutes so the Render free server does not fall asleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --retry 4 --retry-delay 15 --retry-all-errors -m 60 \
            -o /dev/null -w "health/ready -> HTTP %{http_code}\n" \
            https://credobounty.vercel.app/api/health/ready
